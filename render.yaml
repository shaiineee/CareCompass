# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: carecompass
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_CHAT_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: AI_MODEL
        value: gemini-3.5-flash
      - key: AI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: AI_API_KEY
        sync: false
      - key: SUPABASE_ENABLED
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
